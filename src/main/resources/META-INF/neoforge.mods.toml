modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

[[dependencies.'${mod_id}']]
    modId="neoforge"
    type="required"
    versionRange="${loader_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.'${mod_id}']]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.'${mod_id}']]
    modId="geckolib"
    type="required"
    versionRange="[4.8.4,)"
    ordering="AFTER"
    side="BOTH"

# Flight Computer consumes Xaero World Map's native decoded terrain representation.
# Keep the exact client version aligned with the supplied 1.21.1 / 1.44.2 jar.
[[dependencies.'${mod_id}']]
    modId="xaeroworldmap"
    type="required"
    versionRange="[1.44.2,1.44.3)"
    ordering="AFTER"
    side="CLIENT"

# Flight Computer consumes Xaero Minimap's persistent waypoint data as part of the
# same navigation integration. Keep the exact client version aligned with the
# supplied 1.21.1 / 26.4.2 jar.
[[dependencies.'${mod_id}']]
    modId="xaerominimap"
    type="required"
    versionRange="[26.4.2,26.4.3)"
    ordering="AFTER"
    side="CLIENT"
