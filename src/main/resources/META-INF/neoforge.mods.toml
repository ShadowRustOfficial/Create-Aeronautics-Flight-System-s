modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

[[mixins]]
config="flightcomputer.mixins.json"

[[dependencies.'${mod_id}']]
    modId="neoforge"
    type="required"
    versionRange="${loader_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.'${mod_id}']]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.'${mod_id}']]
    modId="geckolib"
    type="required"
    versionRange="[4.8.4,)"
    ordering="AFTER"
    side="BOTH"

# The map engine is Flight Computer-owned. JourneyMap's architecture is used
# as a design reference only; JourneyMap itself is never loaded or required.
# Xaero and VoxelMap are likewise not dependencies.
