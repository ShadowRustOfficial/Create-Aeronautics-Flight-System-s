name: Patch automatic altitude hold

on:
  push:
    branches: ['fix/autopilot-altitude-hold-20260901']

permissions:
  contents: write

jobs:
  verify:
    if: github.event.head_commit.message == 'Run automatic altitude hold patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build patched branch
        run: chmod +x gradlew && ./gradlew build --no-daemon --stacktrace
      - name: Remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-altitude-hold.yml
          git commit -m 'Remove one-off altitude hold workflow'
          git push origin HEAD:fix/autopilot-altitude-hold-20260901
