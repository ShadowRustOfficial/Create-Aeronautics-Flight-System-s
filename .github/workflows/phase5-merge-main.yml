name: Phase 5 validation merge

on:
  push:
    branches: [phase-5-validation]

permissions:
  contents: write

jobs:
  merge-main:
    if: github.event.head_commit.message != 'Temporary validation merge of main control work'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge main and resolve any overlapping paths from main
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git checkout --theirs -- .
            git add -A
            git commit -m "Temporary validation merge of main control work"
          else
            git commit -m "Temporary validation merge of main control work"
          fi
          git push origin HEAD:phase-5-validation
