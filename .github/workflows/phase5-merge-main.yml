name: Phase 5 validation merge

on:
  push:
    branches: [phase-5-validation]

permissions:
  contents: write

jobs:
  merge-main:
    if: github.event.head_commit.message != 'Temporary validation merge of main control work'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge main, preferring main on overlapping files
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --allow-unrelated-histories --no-edit -X theirs origin/main || {
            git status --short
            git diff --name-only --diff-filter=U
            git merge --abort || true
            exit 1
          }
          git push origin HEAD:phase-5-validation
