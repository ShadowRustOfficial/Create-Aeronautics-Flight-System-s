name: Phase 5 patch application

on:
  push:
    branches: [phase-5-validation]
permissions:
  contents: write
jobs:
  edit:
    if: github.event.head_commit.message == 'Trigger Phase 5 patch application'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply Phase 5 integration edits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/main/java/com/flightcomputer/client/gui/NavigationConsoleScreen.java')
          text = p.read_text()
          text = text.replace('import com.flightcomputer.client.map.WaystoneMapProvider;\n', 'import com.flightcomputer.client.map.WaypointMapProvider;\nimport com.flightcomputer.client.map.WaystoneMapProvider;\nimport com.flightcomputer.client.gui.CoolingConsoleScreen;\nimport com.flightcomputer.client.gui.ThermalConsoleScreen;\n')
          text = text.replace('    private EditBox targetInput;\n', '    private EditBox targetInput;\n    private final WaypointMapProvider routeWaypointProvider = new WaypointMapProvider();\n    private final WaystoneMapProvider routeWaystoneProvider = new WaystoneMapProvider();\n    private int routeWaypointIndex;\n    private int routeWaystoneIndex;\n')
          needle = '        addRenderableWidget(Button.builder(Component.literal("DIAGNOSTICS"), b -> switchTab(Tab.DIAGNOSTICS)).bounds(left + 480, top, tabW, 22).build());\n'
          replacement = needle + '''        addRenderableWidget(Button.builder(Component.literal("THERMAL"), b -> minecraft.setScreen(new ThermalConsoleScreen(controllerPos)))\n                .bounds(left + 480, top + 24, 72, 20).build());\n        addRenderableWidget(Button.builder(Component.literal("COOLING"), b -> minecraft.setScreen(new CoolingConsoleScreen(controllerPos)))\n                .bounds(left + 558, top + 24, 72, 20).build());\n'''
          if needle in text and 'new ThermalConsoleScreen' not in text: text = text.replace(needle, replacement, 1)
          needle = '        addRenderableWidget(Button.builder(Component.literal("ABORT ROUTE"), b -> send(FlightControllerAction.ABORT_ROUTE)).bounds(left + 400, top + 180, 180, 20).build());\n'
          replacement = needle + '''        addRenderableWidget(Button.builder(Component.literal("SELECT WAYSTONE"), b -> selectRouteWaystone(b))\n                .bounds(left + 20, top + 230, 180, 20).build());\n        addRenderableWidget(Button.builder(Component.literal("SELECT WAYPOINT"), b -> selectRouteWaypoint(b))\n                .bounds(left + 210, top + 230, 180, 20).build());\n        addRenderableWidget(Button.builder(Component.literal("REFRESH LOCATIONS"), b -> refreshRouteLocations())\n                .bounds(left + 400, top + 230, 180, 20).build());\n'''
          if needle in text and 'selectRouteWaystone' not in text: text = text.replace(needle, replacement, 1)
          needle = '    private void sendTargetFromInput() {\n'
          helpers = '''    private void selectRouteWaystone(Button button) {\n        if (minecraft == null || minecraft.level == null) return;\n        routeWaystoneProvider.tick(minecraft.level);\n        var markers = routeWaystoneProvider.markers();\n        if (markers.isEmpty()) { button.setMessage(Component.literal("NO WAYSTONES")); return; }\n        routeWaystoneIndex = Math.floorMod(routeWaystoneIndex, markers.size());\n        var marker = markers.get(routeWaystoneIndex++);\n        FlightComputerNetwork.sendTarget(controllerPos, marker.worldX(), marker.worldY(), marker.worldZ(), marker.label());\n        button.setMessage(Component.literal("WAYSTONE: " + marker.label()));\n    }\n\n    private void selectRouteWaypoint(Button button) {\n        if (minecraft == null || minecraft.level == null) return;\n        routeWaypointProvider.tick(minecraft.level);\n        var markers = routeWaypointProvider.markers();\n        if (markers.isEmpty()) { button.setMessage(Component.literal("NO WAYPOINTS")); return; }\n        routeWaypointIndex = Math.floorMod(routeWaypointIndex, markers.size());\n        var marker = markers.get(routeWaypointIndex++);\n        FlightComputerNetwork.sendTarget(controllerPos, marker.worldX(), marker.worldY(), marker.worldZ(), marker.label());\n        button.setMessage(Component.literal("WAYPOINT: " + marker.label()));\n    }\n\n    private void refreshRouteLocations() {\n        if (minecraft != null && minecraft.level != null) {\n            routeWaystoneProvider.tick(minecraft.level);\n            routeWaypointProvider.tick(minecraft.level);\n        }\n        routeWaystoneIndex = 0;\n        routeWaypointIndex = 0;\n    }\n\n'''
          if needle in text and 'private void selectRouteWaystone' not in text: text = text.replace(needle, helpers + needle, 1)
          p.write_text(text)

          p = Path('src/main/java/com/flightcomputer/block/FlightControllerBlockEntity.java')
          text = p.read_text()
          text = text.replace('import com.flightcomputer.avionics.FlightControllerActionResult;\n', 'import com.flightcomputer.avionics.FlightControllerActionResult;\nimport com.flightcomputer.avionics.FlightOperationsHolder;\nimport com.flightcomputer.avionics.FlightOperationsState;\n')
          text = text.replace('public class FlightControllerBlockEntity extends BlockEntity implements GeoBlockEntity {', 'public class FlightControllerBlockEntity extends BlockEntity implements GeoBlockEntity, FlightOperationsHolder {')
          text = text.replace('    private UUID controllerId = UUID.randomUUID();\n', '    private UUID controllerId = UUID.randomUUID();\n    private FlightOperationsState flightOperations = new FlightOperationsState();\n')
          text = text.replace('    public UUID getControllerId() { return controllerId; }\n', '    public UUID getControllerId() { return controllerId; }\n    @Override public FlightOperationsState getFlightOperations() { return flightOperations; }\n    @Override public void setFlightOperations(FlightOperationsState state) { flightOperations = state == null ? new FlightOperationsState() : state; markDirtyAndSync(); }\n')
          text = text.replace('        tag.putUUID("ControllerId", controllerId);\n', '        tag.putUUID("ControllerId", controllerId);\n        flightOperations.save(tag);\n')
          text = text.replace('        controllerId = tag.hasUUID("ControllerId") ? tag.getUUID("ControllerId") : UUID.randomUUID();\n', '        controllerId = tag.hasUUID("ControllerId") ? tag.getUUID("ControllerId") : UUID.randomUUID();\n        flightOperations = FlightOperationsState.load(tag);\n')
          p.write_text(text)

          p = Path('src/main/java/com/flightcomputer/control/FlightControlRuntimeManager.java')
          text = p.read_text()
          old = '        Runtime runtime = runtime(controller);\n        runtime.update(controller);\n        runtime.control(controller);'
          new = '        Runtime runtime = runtime(controller);\n        FlightOperationsRuntimeBridge.reconcile(controller);\n        runtime.update(controller);\n        runtime.control(controller);'
          if old in text and 'FlightOperationsRuntimeBridge.reconcile(controller)' not in text: text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/flightcomputer/client/gui/NavigationConsoleScreen.java src/main/java/com/flightcomputer/block/FlightControllerBlockEntity.java src/main/java/com/flightcomputer/control/FlightControlRuntimeManager.java
          git diff --cached --quiet || git commit -m "Apply Phase 5 runtime integration"
          git push origin HEAD:phase-5-validation
      - name: Compile and validate
        run: ./gradlew build --no-daemon
