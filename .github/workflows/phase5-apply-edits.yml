name: Phase 5 patch application

on:
  push:
    branches: [phase-5-validation]
permissions:
  contents: write
jobs:
  edit:
    if: github.event.head_commit.message == 'Trigger Phase 5 patch application'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply Phase 5 integration edits and de-duplicate generated declarations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  print(f'NOT FOUND: {path}: {old[:120]!r}')
                  return False
              p.write_text(text.replace(old, new, 1))
              print(f'PATCHED: {path}')
              return True

          def dedupe_exact(text, needle):
              first = text.find(needle)
              if first < 0:
                  return text
              prefix = text[:first + len(needle)]
              rest = text[first + len(needle):].replace(needle, '')
              return prefix + rest

          # Keep the existing GUI integration edits idempotent.
          p = Path('src/main/java/com/flightcomputer/client/gui/NavigationConsoleScreen.java')
          text = p.read_text()
          for line in [
              'import com.flightcomputer.client.map.WaypointMapProvider;\n',
              'import com.flightcomputer.client.map.WaystoneMapProvider;\n',
              'import com.flightcomputer.client.gui.CoolingConsoleScreen;\n',
              'import com.flightcomputer.client.gui.ThermalConsoleScreen;\n',
          ]:
              text = dedupe_exact(text, line)
          for block in [
              '    private final WaypointMapProvider routeWaypointProvider = new WaypointMapProvider();\n',
              '    private final WaystoneMapProvider routeWaystoneProvider = new WaystoneMapProvider();\n',
              '    private int routeWaypointIndex;\n',
              '    private int routeWaystoneIndex;\n',
          ]:
              text = dedupe_exact(text, block)
          p.write_text(text)

          # Sable stores sub-level blocks in the far-away plot grid. Never call
          # projectOutOfSubLevel blindly: Sable 1.0.x can throw when a position is
          # ordinary world space. First resolve the containing sub-level, then use
          # its logical pose. This also prevents plot coordinates leaking into the
          # telemetry/route speed calculation.
          replace_once(
              'src/main/java/com/flightcomputer/control/FlightControlRuntimeManager.java',
              '''        private Vec3 project(Level level,Vec3 local){\n            if(!ensure())return local;\n            try{Object value=projectOut.invoke(helper,level,local);return value instanceof Vec3 vec?vec:local;}\n            catch(ReflectiveOperationException|RuntimeException ignored){return local;}\n        }''',
              '''        private Vec3 project(Level level, Vec3 local){\n            if(!ensure())return local;\n            try{\n                Object subLevel = containing(level, local);\n                if(subLevel == null)return local;\n                Object pose = invokeNoArg(subLevel, "logicalPose");\n                if(pose == null)return local;\n                Method transform = pose.getClass().getMethod("transformPosition", Vec3.class);\n                Object value = transform.invoke(pose, local);\n                return value instanceof Vec3 vec ? vec : local;\n            }catch(ReflectiveOperationException|RuntimeException ignored){return local;}\n        }'''
          )

          # Vector links are selected against Sable's plot-space BlockPos. The old
          # validation compared that huge plot coordinate to the player's visible
          # world position, rejecting legitimate links. Validate the controller in
          # player space, then validate the thruster in the same local plot space.
          replace_once(
              'src/main/java/com/flightcomputer/network/FlightComputerNetwork.java',
              '''    private static void handleVectorLink(LinkVectorPayload p,IPayloadContext c){c.enqueueWork(()->{if(!(c.player() instanceof ServerPlayer player)||!near(player,p.controllerPos(),64)||!near(player,p.targetPos(),1024))return;FlightMode[] modes=FlightMode.values();VectorDirection[] dirs=VectorDirection.values();if(p.modeId()<0||p.modeId()>=modes.length||p.directionId()<0||p.directionId()>=dirs.length)return;BlockEntity be=player.level().getBlockEntity(p.controllerPos());if(!(be instanceof FlightControllerBlockEntity fc)||player.level().getBlockState(p.targetPos()).isAir())return;fc.bindVector(modes[p.modeId()],dirs[p.directionId()],p.targetPos());});}''',
              '''    private static void handleVectorLink(LinkVectorPayload p,IPayloadContext c){c.enqueueWork(()->{\n        if(!(c.player() instanceof ServerPlayer player)||!near(player,p.controllerPos(),64))return;\n        FlightMode[] modes=FlightMode.values(); VectorDirection[] dirs=VectorDirection.values();\n        if(p.modeId()<0||p.modeId()>=modes.length||p.directionId()<0||p.directionId()>=dirs.length)return;\n        if(p.controllerPos().distSqr(p.targetPos())>512.0D*512.0D)return;\n        BlockEntity controllerBe=player.level().getBlockEntity(p.controllerPos());\n        BlockEntity targetBe=player.level().getBlockEntity(p.targetPos());\n        if(!(controllerBe instanceof FlightControllerBlockEntity fc)||targetBe==null||player.level().getBlockState(p.targetPos()).isAir())return;\n        fc.bindVector(modes[p.modeId()],dirs[p.directionId()],p.targetPos());\n    });}'''
          )

          # Keep target packets finite and reject impossible values before they enter
          # the runtime navigator. NaN is not enough because infinities also poison MPC.
          replace_once(
              'src/main/java/com/flightcomputer/network/FlightComputerNetwork.java',
              '''    private static void handleSetTarget(SetTargetPayload p,IPayloadContext c){c.enqueueWork(()->{if(!(c.player() instanceof ServerPlayer player)||!near(player,p.controllerPos(),64))return;BlockEntity be=player.level().getBlockEntity(p.controllerPos());if(!(be instanceof FlightControllerBlockEntity fc)||Double.isNaN(p.x())||Double.isNaN(p.y())||Double.isNaN(p.z()))return;FlightControlRuntimeManager.setTarget(fc,new Vec3(p.x(),p.y(),p.z()),p.name());});}''',
              '''    private static void handleSetTarget(SetTargetPayload p,IPayloadContext c){c.enqueueWork(()->{if(!(c.player() instanceof ServerPlayer player)||!near(player,p.controllerPos(),64))return;BlockEntity be=player.level().getBlockEntity(p.controllerPos());if(!(be instanceof FlightControllerBlockEntity fc)||!Double.isFinite(p.x())||!Double.isFinite(p.y())||!Double.isFinite(p.z()))return;FlightControlRuntimeManager.setTarget(fc,new Vec3(p.x(),p.y(),p.z()),p.name());});}'''
          )

          # Remove the old global thermal-tab compatibility shell only if it has
          # accidentally regained a subscriber; current source is intentionally empty.
          Path('src/main/java/com/flightcomputer/client/gui/ThermalConsoleTab.java').write_text('''package com.flightcomputer.client.gui;\n\n/** Compatibility shell. Thermal/Cooling buttons are owned only by NavigationConsoleScreen. */\npublic final class ThermalConsoleTab { private ThermalConsoleTab() {} }\n''')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/flightcomputer/client/gui/NavigationConsoleScreen.java src/main/java/com/flightcomputer/block/FlightControllerBlockEntity.java src/main/java/com/flightcomputer/control/FlightControlRuntimeManager.java src/main/java/com/flightcomputer/network/FlightComputerNetwork.java src/main/java/com/flightcomputer/client/gui/ThermalConsoleTab.java
          git diff --cached --quiet || git commit -m "Apply Phase 5 runtime integration"
          git push origin HEAD:phase-5-validation
      - name: Compile and validate
        run: bash ./gradlew clean build --no-daemon --stacktrace
