name: Phase 5 getter edit

on:
  push:
    branches: [phase-5-validation]
permissions:
  contents: write
jobs:
  edit:
    if: github.event.head_commit.message == 'Trigger Phase 5 getter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Add controller position getter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/com/flightcomputer/client/gui/NavigationConsoleScreen.java')
          text=p.read_text()
          getter='    public BlockPos controllerPos() { return controllerPos; }\n\n'
          if getter not in text:
              text=text.replace('    public NavigationConsoleScreen(BlockPos controllerPos) {',getter+'    public NavigationConsoleScreen(BlockPos controllerPos) {',1)
          p.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/flightcomputer/client/gui/NavigationConsoleScreen.java
          git commit -m "Apply Phase 5 getter"
          git push origin HEAD:phase-5-validation
