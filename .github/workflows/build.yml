name: Build Verification

on:
  push:
    branches: [main, phase-5-validation, 'patch/navigation-console-refinement-20260811', 'fix/fc-identity-stabiliser-20260816-v9', 'fix/fc-identity-stabiliser-20260816-v10', 'fix/fc-identity-stabiliser-20260817-v11', 'tmp/fc-ui-audio-validation-20260818']
  pull_request:
    branches: [main, phase-5-validation, 'fix/fc-identity-stabiliser-20260817-v11']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew build --no-daemon --stacktrace
