name: Phase 2 Build Verification

on:
  push:
    branches: [phase-2-map-controls, phase-2-map-controls-buildfix, phase-2-xaero-waypoint-integration]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        shell: bash
        run: |
          set +e
          bash ./gradlew clean build --no-daemon --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          {
            echo '## Gradle build output (last 200 lines)'
            echo '```text'
            tail -n 200 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
