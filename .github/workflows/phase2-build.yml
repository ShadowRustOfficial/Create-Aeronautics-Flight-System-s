name: Phase 2 Build Verification

on:
  push:
    branches: [phase-2-map-controls]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: bash ./gradlew build --no-daemon
